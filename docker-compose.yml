version: '3.8'

services:
  app:
    image: python:3.11-slim
    container_name: python_app
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python main.py"
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"

  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
