version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    restart: always

  python_app:
    image: python:3.11-slim
    container_name: python_app
    volumes:
      - ./app:/app
    working_dir: /app
    command: tail -f /dev/null
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  mongo_data:

